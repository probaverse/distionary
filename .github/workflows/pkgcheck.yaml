name: pkgcheck

# This will cancel running jobs once a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  # Manually trigger the Action under Actions/pkgcheck
  workflow_dispatch:
  # Run on every push to main or development
  push:
    branches:
      - main
      - development

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # The pkgcheck action checks out the repo as the runner user, then runs
      # pkgcheck inside a Docker container as a different user. libgit2 (used by
      # pkgcheck) then refuses to open /github/workspace ("not owned by current
      # user"). libgit2 ignores GIT_CONFIG_* env vars, so we must write
      # safe.directory into the container's $HOME/.gitconfig. The container's
      # HOME (/github/home) is mounted from ${RUNNER_TEMP}/_github_home.
      - name: Mark the workspace as a safe directory for the pkgcheck container
        run: |
          mkdir -p "${RUNNER_TEMP}/_github_home"
          git config --file "${RUNNER_TEMP}/_github_home/.gitconfig" \
            --add safe.directory '*'
      - uses: ropensci-review-tools/pkgcheck-action@main
        with:
          post-to-issue: false
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
