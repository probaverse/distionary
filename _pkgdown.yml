url: https://distionary.probaverse.com/

# Keep the published site on the released version. A development
# version (one with a fourth number) builds to /dev/ instead, so the
# documentation people read never runs ahead of the release they have.
development:
  mode: auto
template:
  bootstrap: 5
  includes:
    in_header: |
      <!-- Google tag (gtag.js) -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-73DKMR0WHY"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-73DKMR0WHY');
      </script>

reference:
- title: Specify
- subtitle: Built-in Distribution Families
  contents:
  - starts_with("dst_")
- subtitle: General Distribution Creation
  contents:
  - distribution
- subtitle: Support
  contents:
  - support-construction
  - empty_support
  - support
  - atoms
  - is_support
- subtitle: Support Algebra
  contents:
  - support_union
  - support_restrict
  - support_transform
  - support_add_atoms
  - support_contains
- subtitle: Distribution Characteristics
  contents:
  - parameters
  - plot.dst
  - pretty_name
  - vtype
- title: Evaluate
- subtitle: Distributional Representations
  contents:
  - starts_with("enframe_")
  - starts_with("eval_")
  - starts_with("prob_")
- subtitle: Distribution Properties
  contents:
  - starts_with("kurtosis")
  - mean.dst
  - median.dst
  - range.dst
  - skewness
  - stdev
  - variance
- subtitle: Random Sampling
  contents:
  - realise
- subtitle: Package Overview
  contents:
  - distionary-package
- title: Built-in Distributional Representations
  desc: Distributional representations not found in the `stats` package.
  contents:
  - ends_with("gev")
  - ends_with("gp")
  - ends_with("lp3")
  - ends_with("pearson3")
